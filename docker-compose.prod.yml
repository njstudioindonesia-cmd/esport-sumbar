services:
  # ============================================================================
  # 1. CORE INFRASTRUCTURE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: esport-sumbar-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esport_network

  redis:
    image: redis:7-alpine
    container_name: esport-sumbar-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esport_network

  nats:
    image: nats:2.10-alpine
    container_name: esport-sumbar-nats
    restart: always
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - esport_network

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: esport-sumbar-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - esport_network

  # ============================================================================
  # 2. BACKEND MICROSERVICES
  # ============================================================================
  identity-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: identity-service
        SERVICE_PORT: 4001
    container_name: esport-identity-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/identity_db
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-sumbar_jwt_prod_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-sumbar_jwt_refresh_prod_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  news-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: news-service
        SERVICE_PORT: 4002
    container_name: esport-news-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/news_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  news-ingestor:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: news-ingestor
        SERVICE_PORT: 4003
    container_name: esport-news-ingestor
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4003
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
    networks:
      - esport_network

  community-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: community-service
        SERVICE_PORT: 4004
    container_name: esport-community-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/community_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  event-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: event-service
        SERVICE_PORT: 4005
    container_name: esport-event-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/event_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  media-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: media-service
        SERVICE_PORT: 4006
    container_name: esport-media-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4006
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      HMAC_SIGNING_SECRET: ${HMAC_SIGNING_SECRET:-sumbar_media_signing_secret_2026}
    depends_on:
      minio:
        condition: service_started
    networks:
      - esport_network

  bracket-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: bracket-service
        SERVICE_PORT: 4007
    container_name: esport-bracket-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4007
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - esport_network

  ai-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: ai-service
        SERVICE_PORT: 4008
    container_name: esport-ai-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4008
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-claude}
    networks:
      - esport_network

  notification-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: notification-service
        SERVICE_PORT: 4009
    container_name: esport-notification-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4009
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/notification_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  # ============================================================================
  # 3. API GATEWAY & WEB FRONTEND
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE_NAME: gateway
        SERVICE_PORT: 4000
    container_name: esport-gateway
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      IDENTITY_SERVICE_URL: http://identity-service:4001
      NEWS_SERVICE_URL: http://news-service:4002
      NEWS_INGESTOR_URL: http://news-ingestor:4003
      COMMUNITY_SERVICE_URL: http://community-service:4004
      EVENT_SERVICE_URL: http://event-service:4005
      MEDIA_SERVICE_URL: http://media-service:4006
      BRACKET_SERVICE_URL: http://bracket-service:4007
      AI_SERVICE_URL: http://ai-service:4008
      NOTIFICATION_SERVICE_URL: http://notification-service:4009
    depends_on:
      - identity-service
      - news-service
      - community-service
      - event-service
      - media-service
      - bracket-service
      - ai-service
      - notification-service
    networks:
      - esport_network

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: esport-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - gateway
    networks:
      - esport_network

  # ============================================================================
  # 4. REVERSE PROXY & SSL TERMINATION
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: esport-sumbar-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - gateway
    networks:
      - esport_network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:

networks:
  esport_network:
    driver: bridge
