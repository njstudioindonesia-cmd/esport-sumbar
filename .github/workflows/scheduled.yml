name: Scheduled Maintenance & Health Tasks

on:
  schedule:
    # Runs everyday at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  instagram-token-monitor:
    name: Check Instagram Graph API Token Expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Instagram Token Health via Gateway
        if: env.API_HOST != ''
        env:
          API_HOST: ${{ secrets.PROD_API_HOST || 'https://api.esportsumbar.id' }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          echo "Checking Instagram Token status..."
          STATUS=$(curl -s -f -H "Authorization: Bearer ${ADMIN_API_KEY}" "${API_HOST}/api/admin/instagram/status" || echo '{"daysRemaining":-1}')
          DAYS=$(echo "$STATUS" | jq -r '.daysRemaining // -1')
          echo "Instagram Token Days Remaining: $DAYS"
          if [ "$DAYS" -ge 0 ] && [ "$DAYS" -le 10 ]; then
            echo "::warning title=Instagram Token Expiring Soon::Token will expire in $DAYS days! Please refresh in Admin Console."
          fi

  dependency-security-audit:
    name: Dependency Audit & Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - name: Run PNPM Security Audit
        run: pnpm audit --audit-level high || true

  backup-verification:
    name: Backup Verification Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Backup Execution & Verification
        if: env.PROD_SSH_HOST != ''
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'deployer' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" 'cd /opt/esport-sumbar && bash infra/scripts/backup.sh'
