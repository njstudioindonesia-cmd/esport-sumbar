name: Deploy Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm release to production'
        required: true
        default: ''

jobs:
  validate-release:
    name: Validate Release Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  deploy-to-production:
    name: Production Rolling Deployment
    runs-on: ubuntu-latest
    needs: [validate-release]
    environment:
      name: production
      url: https://esportsumbar.id
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Credentials
        if: env.PROD_SSH_HOST != ''
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'deployer' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Execute Zero-Downtime Production Deployment
        if: env.PROD_SSH_HOST != ''
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'deployer' }}
        run: |
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" 'cd /opt/esport-sumbar && git fetch --all --tags && git checkout "${GITHUB_REF_NAME}" && bash infra/scripts/deploy.sh prod'
