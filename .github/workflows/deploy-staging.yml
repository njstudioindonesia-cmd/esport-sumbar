name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Monorepo Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  deploy-to-staging:
    name: SSH Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: [test-and-verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        if: env.STAGING_SSH_HOST != ''
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER || 'deployer' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Execute Remote Deploy Script
        if: env.STAGING_SSH_HOST != ''
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER || 'deployer' }}
        run: |
          ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" 'cd /opt/esport-sumbar && git fetch origin develop && git checkout develop && git pull --ff-only && bash infra/scripts/deploy.sh staging'
