# ==============================================================================
# ESPORT SUMBAR v2 - Production Docker Compose Orchestration (Root entrypoint)
# 4 Subdomains: esportsumbar.id (web), eo. (eo), admin. (admin), api. (gateway)
# 9 Microservices + API Gateway + Postgres + Redis + NATS + MinIO + Caddy
# ==============================================================================

name: esport-sumbar-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: esport-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esport_network

  redis:
    image: redis:7-alpine
    container_name: esport-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_sumbar_secret_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_sumbar_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esport_network

  nats:
    image: nats:2.10-alpine
    container_name: esport-prod-nats
    restart: always
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - esport_network

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: esport-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_2026}
    volumes:
      - minio_data:/data
    networks:
      - esport_network

  identity-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: identity-service
        SERVICE_PORT: 4001
    container_name: esport-prod-identity
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/identity_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_sumbar_secret_2026}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-sumbar_jwt_prod_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-sumbar_jwt_refresh_prod_secret_2026}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-sumbar_totp_aes_encryption_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esport_network

  news-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: news-service
        SERVICE_PORT: 4002
    container_name: esport-prod-news
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/news_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_sumbar_secret_2026}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  news-ingestor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: news-ingestor
        SERVICE_PORT: 4003
    container_name: esport-prod-news-ingestor
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4003
      NATS_URL: nats://nats:4222
      IG_APP_ID: ${IG_APP_ID:-}
      IG_APP_SECRET: ${IG_APP_SECRET:-}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      IG_WEBHOOK_VERIFY_TOKEN: ${IG_WEBHOOK_VERIFY_TOKEN:-sumbar_ig_webhook_verify_2026}
      IG_PUBLISH_MODE: ${IG_PUBLISH_MODE:-REVIEW}
    depends_on:
      nats:
        condition: service_started
    networks:
      - esport_network

  community-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: community-service
        SERVICE_PORT: 4004
    container_name: esport-prod-community
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/community_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  event-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: event-service
        SERVICE_PORT: 4005
    container_name: esport-prod-event
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/event_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  media-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: media-service
        SERVICE_PORT: 4006
    container_name: esport-prod-media
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4006
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_2026}
      HMAC_SIGNING_SECRET: ${HMAC_SIGNING_SECRET:-sumbar_media_signing_secret_2026}
    depends_on:
      minio:
        condition: service_started
    networks:
      - esport_network

  bracket-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: bracket-service
        SERVICE_PORT: 4007
    container_name: esport-prod-bracket
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4007
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_sumbar_secret_2026}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - esport_network

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: ai-service
        SERVICE_PORT: 4008
    container_name: esport-prod-ai
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4008
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-claude}
    networks:
      - esport_network

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: notification-service
        SERVICE_PORT: 4009
    container_name: esport-prod-notification
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4009
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_2026}@postgres:5432/notification_db
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esport_network

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: gateway
        SERVICE_PORT: 4000
    container_name: esport-prod-gateway
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      IDENTITY_SERVICE_URL: http://identity-service:4001
      NEWS_SERVICE_URL: http://news-service:4002
      NEWS_INGESTOR_URL: http://news-ingestor:4003
      COMMUNITY_SERVICE_URL: http://community-service:4004
      EVENT_SERVICE_URL: http://event-service:4005
      MEDIA_SERVICE_URL: http://media-service:4006
      BRACKET_SERVICE_URL: http://bracket-service:4007
      AI_SERVICE_URL: http://ai-service:4008
      NOTIFICATION_SERVICE_URL: http://notification-service:4009
    depends_on:
      - identity-service
      - news-service
      - community-service
      - event-service
      - media-service
      - bracket-service
      - ai-service
      - notification-service
    networks:
      - esport_network

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.app
      args:
        APP_NAME: web
        PORT: 3000
        NEXT_PUBLIC_PORTAL_TYPE: web
    container_name: esport-prod-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_PORTAL_TYPE: web
    depends_on:
      - gateway
    networks:
      - esport_network

  eo:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.app
      args:
        APP_NAME: eo
        PORT: 3001
        NEXT_PUBLIC_PORTAL_TYPE: eo
    container_name: esport-prod-eo
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_PORTAL_TYPE: eo
    depends_on:
      - gateway
    networks:
      - esport_network

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.app
      args:
        APP_NAME: admin
        PORT: 3002
        NEXT_PUBLIC_PORTAL_TYPE: admin
    container_name: esport-prod-admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_PORTAL_TYPE: admin
    depends_on:
      - gateway
    networks:
      - esport_network

  caddy:
    image: caddy:2.9-alpine
    container_name: esport-prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@esportsumbar.id}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-esportsumbar.id}
      EO_DOMAIN: ${EO_DOMAIN:-eo.esportsumbar.id}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.esportsumbar.id}
      API_DOMAIN: ${API_DOMAIN:-api.esportsumbar.id}
    volumes:
      - ./infra/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - web
      - eo
      - admin
      - gateway
    networks:
      - esport_network

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  esport_network:
    name: esport_prod_network
    driver: bridge
