# ==============================================================================
# ESPORT SUMBAR v2 - Prometheus Scrape Configuration
# Scrapes metrics from Gateway, Microservices, Node Exporter, and cAdvisor
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:4000"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
